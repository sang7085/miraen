<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=\, initial-scale=1.0" />
    <title>미래엔 사전과제</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <aside class="top-banner">
      <a href="#" class="top-banner__link">
        <div class="top-banner__badge">
          <span class="top-banner__icon"></span>
          <span class="top-banner__badge-text">선착순</span>
        </div>
        <p class="top-banner__text">
          초코 회원이라면
          <strong class="highlight">
            누구나 무료!
            <img
              class="highlight__line"
              src="./assets/images/top-banner-line.svg"
              alt=""
            />
          </strong>
          지금 신청
        </p>
        <div class="top-banner__arrow">
          <img src="../assets/images/banner-arrow.svg" alt="" />
        </div>
      </a>
    </aside>
    <aside class="quick-menu">
      <div class="quick-menu__character">
        <img src="./assets/images/quick-menu-character.png" alt="" />
      </div>
      <ul class="quick-menu__wrap">
        <li class="quick-menu__list">
          <a href="/">계기교육 안내</a>
        </li>
        <li class="quick-menu__list">
          <a href="/">초코타임미리보기</a>
        </li>
        <li class="quick-menu__list">
          <a href="/">커리큘럼과목</a>
        </li>
        <li class="quick-menu__list">
          <a href="/">신청하기</a>
        </li>
        <li class="quick-menu__list top_btn">
          <a href="/">TOP</a>
        </li>
      </ul>
    </aside>
    <header class="header">
      <div class="inner">
        <a href="/" class="header__logo">
          <img src="./assets/images/choco-logo.svg" alt="초코 로고" />
        </a>
        <div class="header__actions">
          <button class="header__login">로그인</button>
          <a href="/" class="header__miraen-logo">
            <img src="./assets/images/miraen-logo.svg" alt="미래엔 로고" />
          </a>
        </div>
      </div>
    </header>
    <main id="container">
      <section id="hero-section" class="hero-section">
        <div class="hero-section__title">
          <img src="./assets/images/hero-title.png" alt="히어로 타이틀" />
        </div>
        <div class="hero-section__banner">
          <img src="./assets/images/hero-banner.png" alt="" />
        </div>
      </section>
      <section id="form-section" class="form-section"></section>
      <section id="promo-section" class="promo-section"></section>
      <section id="tab-section" class="tab-section"></section>
      <section id="tab-section" class="tab-section"></section>
    </main>
    <aside class="bottom-banner">
      <div class="inner">
        <p class="bottom-banner__text">
          <strong class="bottom-banner__highlight">마감 전, 빠르게</strong>
          초코타임 신청하러 가자
        </p>
        <button class="bottom-banner__btn">
          <p class="bottom-banner__btn-text">GO GO!</p>
          <img src="../assets/images/banner-arrow.svg" alt="" />
        </button>
      </div>
    </aside>
  </body>
</html>
