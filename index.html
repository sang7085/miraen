<!doctype html>

  <body>
    <!-- top-banner start -->
    <aside class="top-banner">
      <a href="#" class="link">
        <div class="badge">

            class="icon"
            src="./assets/images/icon/top-banner-siren.svg"

          />

            alt=""

        <p class="text">
          초코 회원이라면

            누구나 무료!

    <!-- quickMenu start -->

    <!-- header start -->

    <!-- main start -->

      <!-- hero section start -->

            <img

            />

          <div class="banner">
            <img
              src="./assets/images/image/hero-banner.png"
              alt="6/17(수) 단 하루! 6월을 이해하는 가장 쉬운 방법 바로 '초코타임'"
            />
          </div>
          <div class="hero-paper">
            <img
              src="./assets/images/image/hero-paper.png"
              alt="수업 내용 아이의 생각을 바꾸는
                    30분의 역사 경험, 참여 선물 초간단 댓글&후기 쓰고
                    특별한 선물 받자, 참여 방법 한국사·입시 전문 쌤과
                    ZOOM에서 실시간으로 만나요!, 신청자는 수업 10분 전부터 '나의 초코타임 수업 들어가기' 클릭 시, 참여 가능"

      <!-- form section end -->
      <section id="form-section" class="form-section">
        <div class="inner">
          <div class="bubble">
            <img src="./assets/images/image/form-bubble.png" alt="6월 공휴일" />
          </div>
          <h2 class="title">
            <img
              src="./assets/images/image/form-title.png"
              alt="아이는 왜 쉬는 날인지 알 고 있을까요"
            />
          </h2>
          <h3 class="sub-title">
            <img
              src="./assets/images/image/form-sub-title.png"
              alt="현충일, 6·25... 이름은 익숙하지만 의미는 낯선 아이들"
            />
          </h3>
          <div class="paper">
            <img
              class="motion1 motion-img"
              src="./assets/images/image/form-newspaper.png"
              alt=""
            />
            <img
              class="motion2 motion-img"
              src="./assets/images/image/form-motion-img1.png"
              alt="3명 중 1명은 별다른 추모나 기념을 하지 않아..."
            />
            <img

              src="./assets/images/image/form-motion-img2.png"
              alt="현충일이 뭐 하는 날인지는 모르고 그냥 노는 날이라 기뻐요"
            />
            <img

              src="./assets/images/image/form-motion-img3.png"

          <!-- form start -->
          <form class="form">
            <div class="form-content">
              <div class="charactor">
                <img src="./assets/images/image/form-charactor.png" alt="" />
              </div>

              <div class="form-group">
                <div class="title-wrap">
                  <h4 class="title">
                    주로 사용하는 퍼블리싱 기술/환경을 선택해 주세요.
                    <span>(복수 선택 가능)</span>
                  </h4>
                </div>
                <div class="form-list ability-list">
                  <label class="ability">
                    <input
                      type="checkbox"
                      name="ability"
                      value="html5"
                      checked
                    />
                    <span>HTML5</span>
                  </label>
                  <label class="ability">
                    <input
                      type="checkbox"
                      name="ability"
                      value="css3"
                      checked
                    />
                    <span>CSS3</span>
                  </label>
                  <label class="ability">
                    <input
                      type="checkbox"
                      name="ability"
                      value="javascript"
                      checked
                    />
                    <span>JavaScript</span>
                  </label>
                  <label class="ability">
                    <input
                      type="checkbox"
                      name="ability"
                      value="jquery"
                      checked
                    />
                    <span>jQuery</span>
                  </label>
                  <label class="ability">
                    <input
                      type="checkbox"
                      name="ability"
                      value="react"
                      checked
                    />
                    <span>React</span>
                  </label>
                  <label class="ability">
                    <input type="checkbox" name="ability" value="vue" />
                    <span>Vue</span>
                  </label>
                  <label class="ability">
                    <input
                      type="checkbox"
                      name="ability"
                      value="figma"
                      checked
                    />
                    <span>Figma</span>
                  </label>
                  <label class="ability">
                    <input
                      type="checkbox"
                      name="ability"
                      value="photoshop"
                      checked
                    />
                    <span>Photoshop</span>
                  </label>
                </div>
              </div>

              <div class="form-group">
                <div class="title-wrap">
                  <h4 class="title">
                    가장 자신 있는 퍼블리싱 영역은 무엇인가요?
                  </h4>
                </div>
                <div class="form-list field-list">
                  <label class="field">
                    <input type="radio" name="area" value="responsive" />
                    <span>반응형 웹</span>
                  </label>
                  <label class="field">
                    <input type="radio" name="area" value="promotion" />
                    <span>프로모션/이벤트 페이지</span>
                  </label>
                  <label class="field">
                    <input type="radio" name="area" value="ui" checked />
                    <span>UI 컴포넌트/디자인 시스템</span>
                  </label>
                  <label class="field">
                    <input type="radio" name="area" value="animation" />
                    <span>CSS 애니메이션/인터랙션</span>
                  </label>
                </div>
              </div>

              <div class="form-group">
                <div class="title-wrap desc">
                  <h4 class="title">
                    포트폴리오 또는 대표 작업물 URL을 작성해 주세요.
                  </h4>
                  <p class="description">
                    퍼블리싱한 웹사이트 주소를 작성해주세요.
                  </p>
                </div>
                <div class="form-list input-wrap">
                  <label for="portfolio" class="blind">포트폴리오 URL</label>
                  <input
                    id="portfolio"
                    type="url"
                    name="portfolio"
                    placeholder="Ex. 중학 국어 2-1(신유식)"
                    value="https://hyun-three.vercel.app"
                  />
                </div>
              </div>

              <div class="form-group">
                <div class="title-wrap">
                  <h4 class="title">
                    이번 퍼블리싱 과제를 진행하면서 가장 신경 쓴 부분이나
                    어필하고 싶은 점을 적어주세요.
                  </h4>
                  <p class="description">
                    마크업 구조, 반응형 처리 방식, CSS 구조화 등 자유롭게 작성해
                    주세요.
                  </p>
                </div>
                <div class="form-list textarea-wrap">
                  <label for="comment" class="blind">과제 내용</label>
                  <textarea id="comment" name="comment" maxlength="2000">
이번 퍼블리싱 과제에서는 반응형 대응과 시멘틱 웹 구현에 가장 중점을 두었습니다.
반응형 웹은 1920px 기준의 디자인을 다양한 화면 크기에서도 자연스럽게 표현할 수 있도록 구현했습니다. 고정된 픽셀 값에만 의존하지 않고 rem 단위를 활용하여 폰트와 주요 요소의 크기를 유연하게 조정했습니다.
시멘틱 웹을 위해 header, main, footer, aside, section 등의 HTML 시맨틱 태그를 콘텐츠의 역할에 맞게 구분하여 사용했습니다. 또한 heading 태그를 콘텐츠의 계층에 맞게 구성하고, form 요소에서는 label과 input을 적절하게 연결하여 사용자가 콘텐츠 구조와 입력 요소를 쉽게 이해할 수 있도록 구성했습니다.
CSS는 SCSS를 사용하여 공통 스타일과 등을 분리하고 반복되는 스타일을 효율적으로 관리할 수 있도록 구성했습니다. 특히 반응형 작업에서 반복적으로 사용되는 계산을 함수화하여 코드의 가독성과 유지보수성을 높였습니다.
CSS의 깊이는 1단계는 position, 2단계는 padding, margin, display 등의 레이아웃 관련 속성, 3단계는 width, height 등의 크기 속성, 4단계는 font-size, line-height, text-align 등의 텍스트 관련 속성, 5단계는 color, background 등의 색상 및 시각적 속성 순으로 작성하여 스타일 선언의 깊이를 일관되게 유지했습니다.
JavaScript는 별도의 라이브러리나 프레임워크에 의존하지 않고 Vanilla JavaScript를 사용했습니다. 탭 메뉴, Swiper 연동, 버튼 상태 변경 등 필요한 인터랙션을 직접 구현하여 불필요한 의존성을 줄이고 기본적인 DOM 조작과 이벤트 처리에 집중했습니다.</textarea
                  >
                  <span class="count">0/2,000</span>
                </div>
              </div>
            </div>

            <button type="button" class="btn">
              <img src="./assets/images/image/form-btn.png" alt="지원하기" />
            </button>
          </form>
          <!-- form end -->
        </div>
      </section>
      <!-- form section end -->

      <!-- promo section start -->

          <div class="content">

                <button type="button" class="btn-play">
                  <img

              <ul class="bullet-list-wrap check">
                <li class="bullet-list">
                  <img

                <li class="bullet-list">

              <div class="charactor">

              </div>
            </div>
          </div>
        </div>
      </section>
